[project]
name = "indic-prompt-compressor"
version = "0.1.0"
description = "Measure and close the token gap for Indic-language prompts"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.46,<5",          # IndicTrans2 remote code + LLMLingua-2 are not tested on transformers 5
    "sentencepiece>=0.2",
    "indictranstoolkit>=1.1",          # IndicProcessor for IndicTrans2 (Cython build; needs gcc)
    "llmlingua>=0.2.2",
    "sentence-transformers>=3.0",
    "tokenizers>=0.20",
    "tiktoken>=0.8",
    "huggingface-hub>=0.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "indic-transliteration>=2.3",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "ipywidgets>=8.1",
    "fastapi>=0.115",                  # icomp app backend
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
